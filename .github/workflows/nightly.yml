name: Nightly

# Full suite including slow tests (QML, Selenium) once a night (test plan 8.5).
# 20:30 UTC = 02:00 IST. Add slow tests as tests/**/slow_*.py.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: All tests including slow ones
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: |
          coverage run --branch -m unittest discover -s tests -t . -p "*.py"
          coverage report
      - name: pip-audit
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: pip-audit -r requirements.txt
