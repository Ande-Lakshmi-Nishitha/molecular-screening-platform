name: CI

# Runs on every pull request and on pushes to main (MSP test plan section 8.4/8.5).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, coverage, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # pin the final version once TBD-C1 is decided
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Pylint, errors only (must be clean)
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: pylint --recursive=y --errors-only backend

      - name: Pylint score (at least 8.0)
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: pylint --recursive=y --fail-under=8.0 backend

      - name: Unit and API tests with coverage (at least 70%)
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: |
          coverage run --branch -m unittest discover -s tests -t .
          coverage report --fail-under=70

      - name: Bandit (medium severity and above)
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: bandit -r backend -ll

      - name: pip-audit (known vulnerable dependencies)
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run lint --if-present

      - name: Unit tests
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm test --if-present

      - name: npm audit (high and critical)
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One stable check name for branch protection to require.
  required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, secrets]
    steps:
      - name: All jobs must succeed
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "secrets:  ${{ needs.secrets.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.secrets.result }}" != "success" ]; then
            exit 1
          fi
